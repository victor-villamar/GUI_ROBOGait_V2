# ROBOGait Configuration File

# Ui Configuration
ui:
  button_height: 17.0
  input_height: 17.0
  combo_height: 17.0
  dropdown_height: 17.0
  list_item_height: 17.0
  badge_height: 14.0
  badge_menu_item_height: 14.0
  icon_button_size: 14.0
  icon_glyph_size: 12.0
  tab_height: 14.0
  checkbox_height: 14.0
  checkbox_indicator_size: 10.0
  spinbox_button_size: 10.0
  joystick_stick_size: 17.0
  pixel_density_override_px_per_mm: 0.0   # 0 = auto
  min_pixel_density_px_per_mm: 2.5
  max_pixel_density_px_per_mm: 5.5
  reference_diagonal_inch: 13.0
  min_scale: 0.85
  max_scale: 1.15
  calibration_factor: 1.0
  min_interactive_px: 44.0
  max_interactive_px: 96.0

# Node Configuration
node:
  namespace: "RoboGait_GUI"

# Database Configuration
database:
  path: ".local/robogait"
  filename: "db_robogait.db"

# ROS2 Configuration
ros2:
  domain_id: 0
  use_namespace_discovery: true
  use_topic_filter: true

# Robot Configuration
robot:
  max_linear_velocity: 0.22
  max_angular_velocity: 2.84

# Timeout Configuration
timeouts:
  start_stop_timeout_s: 25
  qml:
    app_shutdown_delay_ms: 3000
    auth_mode_dropdown_auto_close_ms: 4000
    register_default_idle_timeout_ms: 10000
    register_sign_in_idle_timeout_ms: 60000
    badge_auto_close_ms: 3000
    robot_badge_auto_close_ms: 6000
    error_rectangle_delayed_close_ms: 5000
    test_busy_timeout_ms: 10000
    auto_localization_spin_timeout_ms: 30000
    auto_localization_spin_publish_period_ms: 100
    experiment_save_prompt_delay_ms: 3000

# Map Rendering Configuration
map:
  robot_size: 0.32 # turtlebot3 waffle
  image_path: ".local/robogait/maps/" # local path where map images are stored
  map_path:   "/maps/" # path used in service calls (relative to the robot's home directory)
  spline_path:
    resample_spacing_px: 5.0
    smoothing_window_radius: 2
    catmull_alpha: 0.5
    sample_spacing_px: 4.0
    simplify_tolerance_px: 8.0
    max_anchor_points: 28
    planner_simplify_tolerance_m: 0.08
    planner_min_waypoint_spacing_m: 0.35
    planner_max_waypoint_spacing_m: 0.80
    planner_max_waypoints: 18

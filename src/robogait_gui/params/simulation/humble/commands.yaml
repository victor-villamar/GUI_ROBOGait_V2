cartographer:
  name: "cartographer_node"
  cmd: "ros2 launch turtlebot3_cartographer cartographer.launch.py"
  append_args: "use_sim_time:=True" # use simulation time

map_saver:
  name: "map_saver"
  cmd: "ros2 run nav2_map_server map_saver_cli"
  append_args: "-t {map_topic} -f $HOME{map_path}{map_name} --occ 0.65 --free 0.196" # map file path

delete_map:
  name: "delete_map"
  cmd: "ros2 delete"
  append_args: "$HOME{map_path}{map_name}*" # map file path

navigation:
  name: "bt_navigator"
  cmd: "ros2 launch turtlebot3_navigation2 navigation2.launch.py"
  append_args: "use_sim_time:={navigation_use_sim_time} map:=$HOME{map_path}{map_name} params_file:=$HOME{nav2_params_path}{nav2_params_file}" # navigation launch arguments
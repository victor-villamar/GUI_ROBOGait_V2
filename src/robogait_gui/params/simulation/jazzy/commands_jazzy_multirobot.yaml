# Format: each block defines one process with name, cmd, and append_args.
# The GUI replaces {name} placeholders; the shell expands $HOME and $ROBOT_NAMESPACE.
# Strings are passed to the shell; preserve quotes, spaces, and argument order.

# Only used in simulation, not in real robot

cartographer:
  name: "slam_toolbox"                                                                      # Internal process name used by the GUI
  cmd: "ros2 launch $HOME/GUI_ROBOGait_V2/src/robogait_gui/launch/robogait_slam.launch.py"  # Base command executed by the GUI
  append_args: "namespace:=$ROBOT_NAMESPACE use_sim_time:=true sync:=true"                  # Arguments appended to the base command

map_saver:
  name: "map_saver"                                                                                                                                                                                               # Internal process name used by the GUI
  cmd: "ros2 run nav2_map_server map_saver_cli"                                                                                                                                                                   # Base command executed by the GUI
  append_args: "-t {map_topic} -f $HOME{map_path}{map_name} --occ 0.65 --free 0.196 --ros-args -p save_map_timeout:=15.0 -p use_sim_time:=true -p map_subscribe_transient_local:=true -r __ns:=$ROBOT_NAMESPACE"  # Arguments appended to the base command

delete_map:
  name: "delete_map"                         # Internal process name used by the GUI
  cmd: "ros2 delete"                         # Base command executed by the GUI
  append_args: "$HOME{map_path}{map_name}*"  # Arguments appended to the base command

navigation:
  name: "bt_navigator"                                                                                                                                                                                                                                                    # Internal process name used by the GUI
  cmd: "ros2 launch $HOME/GUI_ROBOGait_V2/src/robogait_gui/launch/robogait_nav2_bringup.launch.py"                                                                                                                                                                        # Base command executed by the GUI
  append_args: "namespace:=$ROBOT_NAMESPACE use_namespace:=true use_sim_time:={navigation_use_sim_time} slam:=False use_localization:=True autostart:=true use_composition:=False map:=$HOME{map_path}{map_name} params_file:=$HOME{nav2_params_path}{nav2_params_file}"  # Arguments appended to the base command
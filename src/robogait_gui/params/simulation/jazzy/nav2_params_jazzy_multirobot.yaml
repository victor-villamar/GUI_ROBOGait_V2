# Format: each ROS 2 node stores its values under ros__parameters; indentation defines the hierarchy.
# Common units: distances in m, times in s, angles in rad, and frequencies in Hz unless stated otherwise.
# Lists name plugins or [x, y, theta] axes; frame and topic names must match TF and ROS 2.

# Only used in simulation, not in real robot

amcl:
  ros__parameters:
    alpha1: 0.2  # Expected rotational noise from odometric rotation.
    alpha2: 0.2  # Expected rotational noise from odometric translation.
    alpha3: 0.2  # Expected translational noise from odometric translation.
    alpha4: 0.2  # Expected translational noise from odometric rotation.
    alpha5: 0.2  # Translational noise for the omnidirectional model.
    base_frame_id: "<robot_namespace>/base_link"  # Robot base TF frame.
    beam_skip_distance: 0.5  # Maximum distance for skipping disagreeing beams (m).
    beam_skip_error_threshold: 0.9  # Fraction of erroneous beams that disables beam skipping.
    beam_skip_threshold: 0.3  # Fraction of disagreeing particles required to skip a beam.
    do_beamskip: false  # Enables skipping disagreeing laser beams.
    global_frame_id: "map"  # Global TF frame used by AMCL.
    lambda_short: 0.1  # Exponential rate of the short-reading component.
    laser_likelihood_max_dist: 2.0  # Maximum obstacle distance used by the laser model (m).
    laser_max_range: 100.0  # Maximum laser range used by AMCL (m).
    laser_min_range: -1.0  # Minimum laser range; a negative value uses the message value (m).
    laser_model_type: "likelihood_field"  # Probabilistic model applied to laser measurements.
    max_beams: 60  # Maximum number of laser beams used per update.
    max_particles: 2000  # Maximum number of filter particles.
    min_particles: 500  # Minimum number of filter particles.
    odom_frame_id: "<robot_namespace>/odom"  # Odometry TF frame.
    pf_err: 0.05  # Maximum permitted particle filter error.
    pf_z: 0.99  # Particle filter statistical confidence.
    recovery_alpha_fast: 0.0  # Fast recovery rate after loss of localization.
    recovery_alpha_slow: 0.0  # Slow recovery rate after loss of localization.
    resample_interval: 1  # Number of updates between particle resampling steps.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # AMCL motion model class.
    save_pose_rate: 0.5  # Last-pose saving frequency (Hz).
    sigma_hit: 0.2  # Standard deviation of the laser hit component (m).
    tf_broadcast: true  # Publishes the global AMCL transform.
    transform_tolerance: 1.0  # Allowed timing margin for TF transforms (s).
    update_min_a: 0.2  # Minimum rotation required to update the filter (rad).
    update_min_d: 0.25  # Minimum displacement required to update the filter (m).
    z_hit: 0.5  # Weight assigned to matching laser readings.
    z_max: 0.05  # Weight assigned to maximum-range readings.
    z_rand: 0.5  # Weight assigned to random laser readings.
    z_short: 0.05  # Weight assigned to unexpectedly short laser readings.
    scan_topic: scan  # LaserScan topic consumed by AMCL.

map_saver:
  ros__parameters:
    save_map_timeout: 5.0  # Maximum time allowed to save a map (s).
    free_thresh_default: 0.25  # Maximum probability for classifying a cell as free.
    occupied_thresh_default: 0.65  # Minimum probability for classifying a cell as occupied.
    map_subscribe_transient_local: true  # Uses transient-local QoS to receive the latest map.

# Navigation parameters from turtlebot4_navigation/config/nav2.yaml.
bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    global_frame: map  # Global reference TF frame.
    robot_base_frame: "<robot_namespace>/base_link"  # Robot base TF frame.
    odom_topic: odom  # ROS 2 odometry topic.
    bt_loop_duration: 10  # Behavior tree loop period (ms).
    default_server_timeout: 20  # Default timeout for BT server calls (ms).
    wait_for_service_timeout: 1000  # Maximum wait for service availability (ms).
    action_server_result_timeout: 900.0  # Maximum retention time for action results (s).
    navigators: ["navigate_to_pose", "navigate_through_poses"]  # Navigators loaded by the BT server.
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"  # Plugin class to load.
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"  # Plugin class to load.
    error_code_names:  # Error codes exposed by the navigator.
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    controller_frequency: 20.0  # Control loop frequency (Hz).
    min_x_velocity_threshold: 0.001  # Minimum X velocity considered nonzero (m/s).
    min_y_velocity_threshold: 0.5  # Minimum Y velocity considered nonzero (m/s).
    min_theta_velocity_threshold: 0.001  # Minimum angular velocity considered nonzero (rad/s).
    failure_tolerance: 0.3  # Permitted controller failure duration (s).
    progress_checker_plugins: ["progress_checker"]  # Available progress checkers.
    goal_checker_plugins: ["general_goal_checker"]  # Available goal checkers.
    controller_plugins: ["FollowPath", "ManualPath"]  # Available local controllers.
    use_realtime_priority: false  # Requests real-time priority for the control loop.

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # Plugin class to load.
      required_movement_radius: 0.5  # Minimum movement required to count as progress (m).
      movement_time_allowance: 10.0  # Time allowed to make progress (s).

    general_goal_checker:
      stateful: true  # Preserves state between evaluation cycles.
      plugin: "nav2_controller::SimpleGoalChecker"  # Plugin class to load.
      xy_goal_tolerance: 0.25  # Goal position tolerance (m).
      yaw_goal_tolerance: 0.25  # Goal angular tolerance (rad).

    # TurtleBot 4 Jazzy default controller.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"  # Plugin class to load.
      time_steps: 56  # Number of predictive horizon steps.
      model_dt: 0.05  # Duration of each predictive step (s).
      batch_size: 2000  # Number of sampled trajectories per iteration.
      ax_max: 3.0  # Maximum longitudinal acceleration (m/s^2).
      ax_min: -3.0  # Minimum longitudinal acceleration (m/s^2).
      ay_max: 3.0  # Maximum lateral acceleration (m/s^2).
      az_max: 3.5  # Maximum angular acceleration (rad/s^2).
      vx_std: 0.2  # Noise standard deviation for X velocity (m/s).
      vy_std: 0.2  # Noise standard deviation for Y velocity (m/s).
      wz_std: 0.4  # Noise standard deviation for angular velocity (rad/s).
      vx_max: 0.5  # Maximum X velocity (m/s).
      vx_min: -0.35  # Minimum X velocity (m/s).
      vy_max: 0.5  # Maximum Y velocity (m/s).
      wz_max: 1.9  # Maximum angular velocity (rad/s).
      iteration_count: 1  # Number of optimization iterations per cycle.
      prune_distance: 1.7  # Path distance retained behind the robot (m).
      transform_tolerance: 0.1  # Allowed timing margin for TF transforms (s).
      temperature: 0.3  # MPPI trajectory selection temperature.
      gamma: 0.015  # MPPI control regularization weight.
      motion_model: "DiffDrive"  # Kinematic model used by MPPI.
      visualize: true  # Publishes controller visualization data.
      regenerate_noises: true  # Regenerates sampling noise on every cycle.
      TrajectoryVisualizer:
        trajectory_step: 5  # Stride between visualized trajectories.
        time_step: 3  # Time stride between visualized points.
      AckermannConstraints:
        min_turning_r: 0.2  # Minimum turning radius (m).
      critics:  # Critics used to score candidate trajectories.
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 4.0  # Critic cost weight.
      GoalCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 5.0  # Critic cost weight.
        threshold_to_consider: 1.4  # Distance threshold for applying the critic (m).
      GoalAngleCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 3.0  # Critic cost weight.
        threshold_to_consider: 0.5  # Distance threshold for applying the critic (m).
      PreferForwardCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 5.0  # Critic cost weight.
        threshold_to_consider: 0.5  # Distance threshold for applying the critic (m).
      CostCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 3.81  # Critic cost weight.
        critical_cost: 300.0  # Cell cost considered critical.
        consider_footprint: true  # Evaluates the full footprint when checking costs.
        collision_cost: 1000000.0  # Penalty assigned to a collision.
        near_goal_distance: 1.0  # Distance at which the goal is considered near (m).
        trajectory_point_step: 2  # Stride between evaluated trajectory points.
      PathAlignCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 14.0  # Critic cost weight.
        max_path_occupancy_ratio: 0.05  # Maximum path occupancy ratio allowed for alignment.
        trajectory_point_step: 4  # Stride between evaluated trajectory points.
        threshold_to_consider: 0.5  # Distance threshold for applying the critic (m).
        offset_from_furthest: 20  # Offset from the furthest reachable path point.
        use_path_orientations: false  # Uses orientations stored in the path.
      PathFollowCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 5.0  # Critic cost weight.
        offset_from_furthest: 5  # Offset from the furthest reachable path point.
        threshold_to_consider: 1.4  # Distance threshold for applying the critic (m).
      PathAngleCritic:
        enabled: true  # Enables this component.
        cost_power: 1  # Exponent applied to the critic cost.
        cost_weight: 2.0  # Critic cost weight.
        offset_from_furthest: 4  # Offset from the furthest reachable path point.
        threshold_to_consider: 0.5  # Distance threshold for applying the critic (m).
        max_angle_to_furthest: 1.0  # Maximum angle to the furthest path point (rad).
        mode: 0  # Critic calculation mode.

    # ROBOGait controller used by manually drawn paths.
    ManualPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # Plugin class to load.
      desired_linear_vel: 0.20  # Nominal path-following linear velocity (m/s).
      lookahead_dist: 0.35  # Nominal lookahead distance (m).
      min_lookahead_dist: 0.20  # Minimum lookahead distance (m).
      max_lookahead_dist: 0.55  # Maximum lookahead distance (m).
      lookahead_time: 0.6  # Horizon used to calculate dynamic lookahead (s).
      rotate_to_heading_angular_vel: 1.0  # Angular velocity used to align the robot (rad/s).
      transform_tolerance: 0.2  # Allowed timing margin for TF transforms (s).
      use_velocity_scaled_lookahead_dist: false  # Scales lookahead distance with velocity.
      use_interpolation: true  # Interpolates an exact point on the path.
      min_approach_linear_velocity: 0.07  # Minimum approach linear velocity (m/s).
      approach_velocity_scaling_dist: 0.30  # Distance at which velocity reduction begins (m).
      use_collision_detection: false  # Checks for collisions during motion.
      max_allowed_time_to_collision_up_to_carrot: 1.0  # Maximum collision-detection horizon (s).
      use_regulated_linear_velocity_scaling: true  # Reduces velocity in tight curves.
      use_cost_regulated_linear_velocity_scaling: true  # Reduces velocity according to costmap cost.
      regulated_linear_scaling_min_radius: 0.30  # Curve radius that activates velocity regulation (m).
      regulated_linear_scaling_min_speed: 0.08  # Minimum speed after curvature regulation (m/s).
      use_fixed_curvature_lookahead: false  # Uses a fixed distance to estimate curvature.
      curvature_lookahead_dist: 0.16  # Distance used to estimate curvature (m).
      use_rotate_to_heading: false  # Allows in-place alignment before following the path.
      rotate_to_heading_min_angle: 0.785  # Minimum angular error for rotating in place (rad).
      max_angular_accel: 3.2  # Maximum angular acceleration (rad/s^2).
      allow_reversing: false  # Allows following the path in reverse.
      max_robot_pose_search_dist: 10.0  # Maximum distance used to find the robot pose on the path (m).

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
      update_frequency: 5.0  # Costmap update frequency (Hz).
      publish_frequency: 2.0  # Costmap publication frequency (Hz).
      global_frame: "<robot_namespace>/odom"  # Global reference TF frame.
      robot_base_frame: "<robot_namespace>/base_link"  # Robot base TF frame.
      rolling_window: true  # Centers and moves the costmap with the robot.
      width: 3  # Costmap width (m).
      height: 3  # Costmap height (m).
      resolution: 0.06  # Costmap cell size (m/cell).
      # Robot footprint polygon, with [x, y] points in meters.
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]  # Layers loaded into the costmap.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # Plugin class to load.
        cost_scaling_factor: 4.0  # Exponential cost decay around obstacles.
        inflation_radius: 0.45  # Obstacle inflation radius (m).
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"  # Plugin class to load.
        enabled: true  # Enables this component.
        publish_voxel_map: true  # Publishes the voxel grid for debugging.
        origin_z: 0.0  # Vertical origin of the voxel grid (m).
        z_resolution: 0.05  # Height of each voxel (m).
        z_voxels: 16  # Number of voxels on the vertical axis.
        max_obstacle_height: 2.0  # Maximum height accepted as an obstacle (m).
        mark_threshold: 0  # Minimum occupied voxels required to mark a cell.
        observation_sources: scan  # Sensor sources used by this layer.
        scan:
          topic: scan  # ROS 2 topic for this data source.
          max_obstacle_height: 2.0  # Maximum height accepted as an obstacle (m).
          clearing: true  # Allows ray tracing to clear cells.
          marking: true  # Allows the source to mark occupied cells.
          data_type: "LaserScan"  # ROS 2 message type for this source.
          raytrace_max_range: 3.0  # Maximum range for clearing obstacles (m).
          raytrace_min_range: 0.0  # Minimum range for clearing obstacles (m).
          obstacle_max_range: 2.5  # Maximum range for marking obstacles (m).
          obstacle_min_range: 0.0  # Minimum range for marking obstacles (m).
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # Plugin class to load.
        map_subscribe_transient_local: true  # Uses transient-local QoS to receive the latest map.
      always_send_full_costmap: true  # Always publishes the complete costmap.

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
      update_frequency: 1.0  # Costmap update frequency (Hz).
      publish_frequency: 1.0  # Costmap publication frequency (Hz).
      global_frame: map  # Global reference TF frame.
      robot_base_frame: "<robot_namespace>/base_link"  # Robot base TF frame.
      # Robot footprint polygon, with [x, y] points in meters.
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      resolution: 0.06  # Costmap cell size (m/cell).
      track_unknown_space: true  # Preserves cells representing unknown space.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # Layers loaded into the costmap.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # Plugin class to load.
        enabled: true  # Enables this component.
        observation_sources: scan  # Sensor sources used by this layer.
        scan:
          topic: scan  # ROS 2 topic for this data source.
          max_obstacle_height: 2.0  # Maximum height accepted as an obstacle (m).
          clearing: true  # Allows ray tracing to clear cells.
          marking: true  # Allows the source to mark occupied cells.
          data_type: "LaserScan"  # ROS 2 message type for this source.
          raytrace_max_range: 3.0  # Maximum range for clearing obstacles (m).
          raytrace_min_range: 0.0  # Minimum range for clearing obstacles (m).
          obstacle_max_range: 2.5  # Maximum range for marking obstacles (m).
          obstacle_min_range: 0.0  # Minimum range for marking obstacles (m).
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # Plugin class to load.
        map_subscribe_transient_local: true  # Uses transient-local QoS to receive the latest map.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # Plugin class to load.
        cost_scaling_factor: 4.0  # Exponential cost decay around obstacles.
        inflation_radius: 0.45  # Obstacle inflation radius (m).
      always_send_full_costmap: true  # Always publishes the complete costmap.

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    planner_plugins: ["GridBased"]  # Available global planners.
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  # Plugin class to load.
      tolerance: 0.5  # Maximum distance to an approximate goal (m).
      use_astar: false  # Uses A* instead of Dijkstra.
      allow_unknown: true  # Allows planning through unknown space.

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    smoother_plugins: ["simple_smoother"]  # Available path smoothers.
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # Plugin class to load.
      tolerance: 1.0e-10  # Convergence tolerance of the smoothing algorithm.
      max_its: 1000  # Maximum number of smoothing iterations.
      do_refinement: true  # Repeats smoothing to refine the result.

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    local_costmap_topic: local_costmap/costmap_raw  # Raw local costmap topic.
    global_costmap_topic: global_costmap/costmap_raw  # Raw global costmap topic.
    local_footprint_topic: local_costmap/published_footprint  # Footprint topic in the local costmap.
    global_footprint_topic: global_costmap/published_footprint  # Footprint topic in the global costmap.
    cycle_frequency: 10.0  # Behavior execution frequency (Hz).
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # Available recovery behaviors.
    spin:
      plugin: "nav2_behaviors::Spin"  # Plugin class to load.
    backup:
      plugin: "nav2_behaviors::BackUp"  # Plugin class to load.
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"  # Plugin class to load.
    wait:
      plugin: "nav2_behaviors::Wait"  # Plugin class to load.
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"  # Plugin class to load.
    global_frame: map  # Global reference TF frame.
    local_frame: "<robot_namespace>/odom"  # Local reference TF frame.
    robot_base_frame: "<robot_namespace>/base_link"  # Robot base TF frame.
    transform_tolerance: 0.1  # Allowed timing margin for TF transforms (s).
    simulate_ahead_time: 2.0  # Simulation horizon used for collision checks (s).
    max_rotational_vel: 1.0  # Maximum behavior angular velocity (rad/s).
    min_rotational_vel: 0.4  # Minimum behavior angular velocity (rad/s).
    rotational_acc_lim: 3.2  # Maximum angular acceleration (rad/s^2).

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    loop_rate: 20  # Waypoint follower loop frequency (Hz).
    stop_on_failure: false  # Stops the sequence when a waypoint fails.
    action_server_result_timeout: 900.0  # Maximum retention time for action results (s).
    waypoint_task_executor_plugin: "wait_at_waypoint"  # Plugin executed upon reaching each waypoint.
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # Plugin class to load.
      enabled: true  # Enables this component.
      waypoint_pause_duration: 200  # Pause at each waypoint (ms).

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    smoothing_frequency: 20.0  # Velocity smoothing frequency (Hz).
    scale_velocities: false  # Scales all axes together when limiting acceleration.
    feedback: "OPEN_LOOP"  # Velocity smoother feedback source.
    max_velocity: [0.26, 0.0, 1.0]  # Maximum [x, y, theta] velocities in m/s and rad/s.
    min_velocity: [-0.26, 0.0, -1.0]  # Minimum [x, y, theta] velocities in m/s and rad/s.
    max_accel: [2.5, 0.0, 3.2]  # Maximum [x, y, theta] accelerations in m/s^2 and rad/s^2.
    max_decel: [-2.5, 0.0, -3.2]  # Maximum [x, y, theta] decelerations in m/s^2 and rad/s^2.
    odom_topic: "odom"  # ROS 2 odometry topic.
    odom_duration: 0.1  # Odometry time window used for feedback (s).
    deadband_velocity: [0.0, 0.0, 0.0]  # Velocity deadband for [x, y, theta].
    velocity_timeout: 1.0  # Time without commands before publishing zero velocity (s).

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    base_frame_id: "<robot_namespace>/base_link"  # Robot base TF frame.
    odom_frame_id: "<robot_namespace>/odom"  # Odometry TF frame.
    cmd_vel_in_topic: "cmd_vel_smoothed"  # Velocity input topic for the monitor.
    cmd_vel_out_topic: "cmd_vel"  # Safe velocity output topic.
    state_topic: "collision_monitor_state"  # Topic where monitor state is published.
    transform_tolerance: 0.2  # Allowed timing margin for TF transforms (s).
    source_timeout: 1.0  # Maximum permitted sensor data age (s).
    base_shift_correction: true  # Corrects base displacement caused by latency.
    stop_pub_timeout: 2.0  # Duration for which stop commands are published (s).
    polygons: ["FootprintApproach"]  # Safety zones evaluated by the monitor.
    FootprintApproach:
      type: "polygon"  # Geometric or sensor type of this component.
      action_type: "approach"  # Action applied when entering the zone.
      footprint_topic: "local_costmap/published_footprint"  # ROS 2 robot footprint topic.
      time_before_collision: 1.2  # Minimum predicted time before collision (s).
      simulation_time_step: 0.1  # Prediction time step (s).
      min_points: 6  # Minimum sensor points required to activate the zone.
      visualize: false  # Publishes controller visualization data.
      enabled: true  # Enables this component.
    observation_sources: ["scan"]  # Sensor sources used by this layer.
    scan:
      type: "scan"  # Geometric or sensor type of this component.
      topic: "scan"  # ROS 2 topic for this data source.
      min_height: 0.15  # Minimum accepted point height (m).
      max_height: 2.0  # Maximum accepted point height (m).
      enabled: true  # Enables this component.

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true  # Uses TwistStamped velocity commands.
    controller_frequency: 50.0  # Control loop frequency (Hz).
    initial_perception_timeout: 5.0  # Maximum wait for initial dock detection (s).
    wait_charge_timeout: 5.0  # Maximum wait for charging detection (s).
    dock_approach_timeout: 30.0  # Maximum dock approach time (s).
    undock_linear_tolerance: 0.05  # Linear undocking tolerance (m).
    undock_angular_tolerance: 0.1  # Angular undocking tolerance (rad).
    max_retries: 3  # Maximum number of docking retries.
    base_frame: "<robot_namespace>/base_link"  # Base TF frame used for docking.
    fixed_frame: "<robot_namespace>/odom"  # Fixed TF frame used for docking.
    dock_backwards: false  # Approaches the dock in reverse.
    dock_prestaging_tolerance: 0.5  # Dock prestaging pose tolerance (m).
    dock_plugins: ["simple_charging_dock"]  # Available dock type plugins.
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"  # Plugin class to load.
      docking_threshold: 0.05  # Distance at which docking is considered complete (m).
      staging_x_offset: -0.7  # X offset of the dock prestaging pose (m).
      use_external_detection_pose: true  # Uses an external pose to locate the dock.
      use_battery_status: false  # Confirms docking through battery status.
      use_stall_detection: false  # Confirms contact by detecting motor stall.
      external_detection_timeout: 1.0  # Maximum age of the external detection (s).
      external_detection_translation_x: -0.18  # X correction for the external detection (m).

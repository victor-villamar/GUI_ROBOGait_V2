# Real robot commands

cartographer:
  name: "slam_toolbox"
  cmd: "ros2 launch roverrobotics_driver multi_slam_launch.py"
  append_args: "robot_namespace:={namespace}"

map_saver:
  name: "map_saver"
  cmd: "ros2 run nav2_map_server map_saver_cli"
  append_args: "-t {map_topic} -f $HOME{map_path}{map_name} --occ 0.65 --free 0.196 --ros-args -p save_map_timeout:=15.0 -p use_sim_time:=false"

delete_map:
  name: "delete_map"
  cmd: "ros2 delete"
  append_args: "$HOME{map_path}{map_name}*"

navigation:
  name: "bt_navigator"
  cmd: "ros2 launch roverrobotics_driver multi_navigation_nuevo.launch.py"
  append_args: "namespace:={namespace} use_namespace:=true map:=$HOME{map_path}{map_name}"
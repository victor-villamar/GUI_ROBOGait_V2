name: Add Mermaid diagram to PR description

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  update-pr-body:
    runs-on: ubuntu-latest

    steps:
      - name: Create Mermaid diagram and update PR body
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.pull_request.head.ref;
            const target = context.payload.pull_request.base.ref;

            const mermaid = [
              '---',
              '```mermaid',
              'graph TD;',
              `  ${source} --> ${target};`,
              '```',
              '---'
            ].join('\n');

            const updatedBody = `${mermaid}\n\n${context.payload.pull_request.body || ''}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: updatedBody
            });
